name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDKs (11 for the toolchain, 21 to run Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            11
            21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: the legacy "tools" package no longer exists.
          # AGP downloads the compileSdk platform and build-tools itself (licenses are accepted here).
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: tuner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Unsigned, only to catch release-only problems (R8 shrinking) before tagging a release.
      - name: Build release APK (unsigned check)
        run: ./gradlew assembleRelease
